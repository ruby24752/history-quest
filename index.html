<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史闯关 · 七年级上册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ecd7;
  --bg-deep:#e8d9b8;
  --surface:#fff8e7;
  --line:#d4b88a;
  --text:#3a2e1f;
  --text-2:#6b5a42;
  --accent:#9a3b2e;
  --accent-2:#7a2a20;
  --gold:#b8860b;
  --green:#4a7c59;
  --shadow:0 4px 20px rgba(139,90,43,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{
  font-family:"Noto Sans SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:16px;
  position:relative;
  overflow-x:hidden;
}
/* 历史纹样背景 */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(154,59,46,.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(184,134,11,.04) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}
/* 青铜纹装饰 */
body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:8px;
  background:repeating-linear-gradient(90deg,
    var(--accent) 0px, var(--accent) 20px,
    var(--gold) 20px, var(--gold) 40px);
  opacity:.3;
  z-index:100;
}
.page{display:none;position:relative;z-index:1;}
.page.active{display:block;}

/* 标题 */
.header{
  text-align:center;
  padding:30px 20px 20px;
}
.header h1{
  font-family:"Noto Serif SC",serif;
  font-size:32px;
  color:var(--accent);
  margin-bottom:8px;
  letter-spacing:4px;
}
.header .seal{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:2px 12px;
  font-size:12px;
  border-radius:4px;
  margin-bottom:12px;
  letter-spacing:2px;
}
.header p{
  color:var(--text-2);
  font-size:14px;
  line-height:1.6;
}

/* 课程列表 */
.lesson-grid{
  max-width:800px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:20px 0;
}
.lesson-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px 20px;
  cursor:pointer;
  transition:all .3s;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:var(--shadow);
}
.lesson-card:hover{
  transform:translateX(8px);
  border-color:var(--accent);
}
.lesson-num{
  width:44px;
  height:44px;
  background:var(--accent);
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Noto Serif SC",serif;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0;
}
.lesson-info{flex:1;}
.lesson-title{
  font-size:16px;
  font-weight:600;
  color:var(--text);
  margin-bottom:4px;
}
.lesson-meta{
  font-size:12px;
  color:var(--text-2);
}
.lesson-arrow{
  color:var(--line-strong);
  font-size:20px;
}

/* 答题页 */
.quiz-box{
  max-width:700px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  box-shadow:var(--shadow);
}
.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:8px;
}
.quiz-header .lesson-name{
  font-size:14px;
  color:var(--accent);
  font-weight:600;
}
.quiz-stats{
  display:flex;
  gap:12px;
  font-size:13px;
  color:var(--text-2);
}
.quiz-stats span{
  background:var(--bg-deep);
  padding:4px 10px;
  border-radius:12px;
}
.timer-bar{
  height:6px;
  background:var(--bg-deep);
  border-radius:3px;
  margin-bottom:20px;
  overflow:hidden;
}
.timer-fill{
  height:100%;
  background:var(--green);
  border-radius:3px;
  transition:width .3s linear;
}
.timer-fill.warning{
  background:var(--accent);
}
.question{
  font-size:18px;
  line-height:1.6;
  margin-bottom:24px;
  font-weight:600;
}
.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.option{
  padding:14px 18px;
  background:var(--bg);
  border:2px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  transition:all .2s;
  font-size:15px;
  line-height:1.5;
}
.option:hover{
  border-color:var(--gold);
  background:var(--bg-deep);
}
.option.right{
  background:#e8f5e9;
  border-color:var(--green);
  color:#2e7d32;
}
.option.wrong{
  background:#ffebee;
  border-color:var(--accent);
  color:#c62828;
}
.option.disabled{pointer-events:none;}

/* 解析面板 */
.explain-panel{
  margin-top:20px;
  padding:16px;
  background:#fff8e1;
  border-left:4px solid var(--gold);
  border-radius:8px;
  display:none;
}
.explain-panel.show{display:block;}
.explain-title{
  font-weight:600;
  color:var(--gold);
  margin-bottom:8px;
  font-size:14px;
}
.explain-text{
  font-size:14px;
  line-height:1.7;
  color:var(--text-2);
}
.next-btn{
  display:block;
  width:100%;
  margin-top:16px;
  padding:14px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;
}
.next-btn:hover{opacity:.9;}

/* 结果页 */
.result-box{
  max-width:500px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 30px;
  text-align:center;
  box-shadow:var(--shadow);
}
.result-box h2{
  font-family:"Noto Serif SC",serif;
  color:var(--accent);
  margin-bottom:20px;
  font-size:28px;
}
.result-score{
  font-size:48px;
  font-weight:900;
  color:var(--gold);
  margin:16px 0;
}
.result-msg{
  color:var(--text-2);
  line-height:1.8;
  margin-bottom:24px;
}
.result-btns{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  padding:12px 24px;
  border:none;
  border-radius:25px;
  font-size:15px;
  cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--bg-deep);color:var(--text);}

/* 语音开关 */
.voice-toggle{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;
  cursor:pointer;
  z-index:200;
  box-shadow:var(--shadow);
}
.voice-toggle.on{background:var(--green);color:#fff;border-color:var(--green);}

.tip{
  text-align:center;
  color:var(--text-2);
  font-size:12px;
  margin-top:20px;
}

@media (max-width:480px){
  .header h1{font-size:24px;}
  .lesson-card{padding:14px 16px;}
  .quiz-box{padding:18px;}
  .question{font-size:16px;}
}
</style>
</head>
<body>
<div class="voice-toggle on" id="voiceToggle" onclick="toggleVoice()">🔊 语音开</div>

<!-- 课程选择页 -->
<div id="pageHome" class="page active">
  <div class="header">
    <div class="seal">历史闯关</div>
    <h1>七上历史</h1>
    <p>按课选题 · 每题15秒 · 3条生命<br>答错显示解析 · 连击加分</p>
  </div>
  <div class="lesson-grid" id="lessonList"></div>
  <p class="tip">共20课 · 约180道常考选择题 · 防复制已开启</p>
</div>

<!-- 答题页 -->
<div id="pageQuiz" class="page">
  <div class="quiz-box">
    <div class="quiz-header">
      <span class="lesson-name" id="currentLesson"></span>
      <div class="quiz-stats">
        <span>第<span id="qNum">1</span>/<span id="qTotal">10</span>题</span>
        <span>❤️<span id="lives">3</span></span>
        <span>连击<span id="combo">0</span></span>
        <span>得分<span id="score">0</span></span>
      </div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>
    <div class="explain-panel" id="explainPanel">
      <div class="explain-title">📖 考点解析</div>
      <div class="explain-text" id="explainText"></div>
      <button class="next-btn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>
</div>

<!-- 结果页 -->
<div id="pageResult" class="page">
  <div class="result-box">
    <h2>闯关结束</h2>
    <div class="result-score" id="finalScore">0</div>
    <p class="result-msg" id="resultMsg"></p>
    <div class="result-btns">
      <button class="btn btn-primary" onclick="retryQuiz()">再考一次</button>
      <button class="btn btn-secondary" onclick="backToLessons()">返回课程列表</button>
    </div>
  </div>
</div>

<script>
// 音效资源
const audioCorrect = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
const audioWrong = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-error-2564.mp3");
audioCorrect.volume = 0.4;
audioWrong.volume = 0.4;

let voiceOn = true;
function toggleVoice(){
  voiceOn = !voiceOn;
  const btn = document.getElementById("voiceToggle");
  if(voiceOn){
    btn.classList.add("on");
    btn.innerText = "🔊 语音开";
  }else{
    btn.classList.remove("on");
    btn.innerText = "🔇 语音关";
  }
}

function speakText(text){
  if(!voiceOn) return;
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 1.1;
  u.volume = 0.6;
  window.speechSynthesis.speak(u);
}

// 题库
const POOL = [
  // 第1课 远古人类
  {tag:"第1课 远古时期的人类活动", q:"我国境内目前已知最早的古人类之一是？", opts:["北京人","元谋人","山顶洞人","蓝田人"], a:1, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。北京人距今约70万—20万年，山顶洞人距今约3万年。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人生活的年代距今约？", opts:["170万年","70万年","3万年","100万年"], a:0, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人发现于今天的哪个省？", opts:["陕西省","云南省","北京市","湖北省"], a:1, explain:"元谋人发现于云南元谋县，因此得名“元谋人”。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人生活的地点是？", opts:["云南元谋","陕西蓝田","北京周口店龙骨山","浙江余姚"], a:2, explain:"北京人遗址位于北京西南周口店龙骨山上。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人生活的年代距今约？", opts:["约170万年","约70万—20万年","约3万年","约1万年"], a:1, explain:"北京人生活在距今约70万—20万年。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人使用的石器属于？", opts:["磨制石器","打制石器","玉器","陶器"], a:1, explain:"北京人制作石器的技术比较成熟，采用不同的打制方法，制作成不同类型的工具。"},
  {tag:"第1课 远古时期的人类活动", q:"使用打制石器的时代称为？", opts:["新石器时代","旧石器时代","青铜时代","铁器时代"], a:1, explain:"使用打制石器的时代，叫作旧石器时代。"},
  {tag:"第1课 远古时期的人类活动", q:"关于北京人用火，正确的是？", opts:["会人工取火","使用天然火并保存火种","不会用火","只会生火不会保存"], a:1, explain:"北京人已经学会使用火，还会长时间保存火种。"},
  {tag:"第1课 远古时期的人类活动", q:"山顶洞人生活的年代距今约？", opts:["170万年","70万年","3万年","7000年"], a:2, explain:"山顶洞人生活在距今约3万年。"},
  {tag:"第1课 远古时期的人类活动", q:"山顶洞人相比北京人，掌握的新技术是？", opts:["打制石器","磨光和钻孔技术","种植水稻","建造房屋"], a:1, explain:"山顶洞人已经掌握磨光和钻孔技术。"},
  {tag:"第1课 远古时期的人类活动", q:"已经懂得人工取火的远古人类是？", opts:["元谋人","北京人","山顶洞人","郧县人"], a:2, explain:"山顶洞人已经懂得人工取火。"},
  {tag:"第1课 远古时期的人类活动", q:"会制作骨针、有爱美意识的远古人类是？", opts:["北京人","元谋人","山顶洞人","半坡人"], a:2, explain:"山顶洞人有爱美意识，会缝制衣服。"},

  // 第2课 原始农耕
  {tag:"第2课 原始农业与史前社会", q:"河姆渡遗址位于今天的哪个省？", opts:["陕西","浙江","北京","湖北"], a:1, explain:"河姆渡遗址位于浙江余姚，属于长江流域。"},
  {tag:"第2课 原始农业与史前社会", q:"河姆渡居民种植的主要农作物是？", opts:["粟","水稻","小麦","玉米"], a:1, explain:"河姆渡人种植水稻，我国是世界上最早种植水稻的国家之一。"},
  {tag:"第2课 原始农业与史前社会", q:"河姆渡居民居住的房屋样式是？", opts:["半地穴式圆形房屋","干栏式建筑","宫殿","窑洞"], a:1, explain:"河姆渡人居住干栏式建筑，通风防潮。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡遗址位于今天的哪个城市附近？", opts:["陕西西安","浙江余姚","北京周口店","云南元谋"], a:0, explain:"半坡遗址位于陕西西安东部半坡村，属于黄河流域。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡居民种植的主要农作物是？", opts:["水稻","粟","玉米","大豆"], a:1, explain:"半坡人种植粟，我国是世界上最早种植粟的国家之一。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡居民居住的房屋样式是？", opts:["干栏式建筑","半地穴式圆形房屋","高架屋","砖瓦房"], a:1, explain:"半坡人居住半地穴式圆形房屋，保暖防风。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡遗址出土的彩陶代表器物是？", opts:["玉琮","人面鱼纹彩陶盆","骨耜","铁犁"], a:1, explain:"半坡彩陶以人面鱼纹彩陶盆最为著名。"},
  {tag:"第2课 原始农业与史前社会", q:"河姆渡遗址出土的农业生产工具主要是？", opts:["铁农具","骨耜","铜器","石镰"], a:1, explain:"河姆渡人使用骨耜耕地。"},
  {tag:"第2课 原始农业与史前社会", q:"使用磨制石器的时代称为？", opts:["旧石器时代","新石器时代","青铜时代","金石并用时代"], a:1, explain:"使用磨制石器的时代，叫作新石器时代。"},
  {tag:"第2课 原始农业与史前社会", q:"我国原始农耕时代形成的农作物分布格局是？", opts:["南粟北稻","南稻北粟","南北都种水稻","南北都种粟"], a:1, explain:"河姆渡种水稻（南方），半坡种粟（北方），形成南稻北粟的格局。"},

  // 第3课 文明起源
  {tag:"第3课 中华文明的起源", q:"被后人尊崇为中华民族“人文初祖”的是？", opts:["尧和舜","炎帝和黄帝","禹和启","蚩尤"], a:1, explain:"炎帝和黄帝部落联盟以后逐渐形成华夏族，后人尊崇炎帝和黄帝为中华民族的人文初祖。"},
  {tag:"第3课 中华文明的起源", q:"炎黄部落联盟以后逐渐形成为？", opts:["华夏族","蒙古族","朝鲜族","藏族"], a:0, explain:"炎黄部落联盟以后逐渐形成为华夏族，因此后人尊崇炎帝和黄帝为中华民族的人文初祖。"},
  {tag:"第3课 中华文明的起源", q:"黄帝和炎帝之间进行的战役是？", opts:["涿鹿之战","阪泉之战","牧野之战","巨鹿之战"], a:1, explain:"黄帝和炎帝在阪泉之战中打败炎帝，两大部落结成联盟。"},
  {tag:"第3课 中华文明的起源", q:"炎黄部落打败蚩尤部落的战役是？", opts:["阪泉之战","涿鹿之战","长平之战","桂陵之战"], a:1, explain:"炎黄部落在涿鹿之战中打败蚩尤部落，联盟逐渐形成华夏族。"},
  {tag:"第3课 中华文明的起源", q:"尧、舜、禹时期，将联盟首领位子传给贤德之人的制度是？", opts:["世袭制","禅让制","分封制","郡县制"], a:1, explain:"禅让制是将部落联盟首领位子传给贤德之人的制度。"},
  {tag:"第3课 中华文明的起源", q:"禅让制推举部落联盟首领的标准是？", opts:["血缘亲疏","贤德与才能","财富多少","武力强弱"], a:1, explain:"禅让制推举的标准是贤德与才能。"},
  {tag:"第3课 中华文明的起源", q:"三过家门而不入、治水有功的是？", opts:["黄帝","尧","舜","禹"], a:3, explain:"禹全身心投入治水，曾三过家门而不入，经过10多年努力，终于消除了水患。"},
  {tag:"第3课 中华文明的起源", q:"大禹治水采用的主要方法是？", opts:["堵塞","疏导","抽干","迁移"], a:1, explain:"禹采用疏导的方法，开凿河渠疏导洪水入海。"},
  {tag:"第3课 中华文明的起源", q:"良渚古城遗址位于今天的？", opts:["山西襄汾","浙江余杭","陕西西安","北京周口店"], a:1, explain:"良渚古城遗址位于浙江余杭。"},

// 状态
const QUESTION_TIME = 15;
const TOTAL_Q = 10;
let currentLesson = "";
let currentQuestions = [];
let qIndex = 0;
let score = 0;
let combo = 0;
let lives = 3;
let correctCount = 0;
let timerInterval = null;
let timeLeft = QUESTION_TIME;

// 初始化：提取所有课
function getLessons(){
  const lessonSet = {};
  POOL.forEach(q=>{
    if(!lessonSet[q.tag]) lessonSet[q.tag] = 0;
    lessonSet[q.tag]++;
  });
  return Object.entries(lessonSet).map(([name, count])=>({name, count}));
}

// 渲染课程列表
function renderLessons(){
  const lessons = getLessons();
  const list = document.getElementById("lessonList");
  list.innerHTML = "";
  lessons.forEach((lesson, idx)=>{
    const div = document.createElement("div");
    div.className = "lesson-card";
    div.innerHTML = `
      <div class="lesson-num">${idx+1}</div>
      <div class="lesson-info">
        <div class="lesson-title">${lesson.name}</div>
        <div class="lesson-meta">共${lesson.count}题 · 每次随机${Math.min(TOTAL_Q, lesson.count)}题</div>
      </div>
      <div class="lesson-arrow">→</div>
    `;
    div.onclick = ()=>startQuiz(lesson.name);
    list.appendChild(div);
  });
}

// 开始答题
function startQuiz(lessonName){
  currentLesson = lessonName;
  const lessonQuestions = POOL.filter(q=>q.tag === lessonName);
  currentQuestions = shuffle(lessonQuestions).slice(0, Math.min(TOTAL_Q, lessonQuestions.length));
  qIndex = 0;
  score = 0;
  combo = 0;
  lives = 3;
  correctCount = 0;
  document.getElementById("qTotal").innerText = currentQuestions.length;
  document.getElementById("currentLesson").innerText = lessonName;
  showQuestion();
  switchPage("pageQuiz");
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 显示题目
function showQuestion(){
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimer();
  
  const q = currentQuestions[qIndex];
  document.getElementById("qNum").innerText = qIndex+1;
  document.getElementById("lives").innerText = lives;
  document.getElementById("combo").innerText = combo;
  document.getElementById("score").innerText = score;
  document.getElementById("questionText").innerText = (qIndex+1) + ". " + q.q;
  
  const optWrap = document.getElementById("options");
  optWrap.innerHTML = "";
  q.opts.forEach((op, idx)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = String.fromCharCode(65+idx) + ". " + op;
    div.onclick = ()=>chooseAnswer(div, idx, q.a, q.explain);
    optWrap.appendChild(div);
  });
  
  document.getElementById("explainPanel").classList.remove("show");
  startTimer();
}

function startTimer(){
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimer();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      stopTimer();
      timeUp();
    }
  }, 1000);
}

function stopTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimer(){
  const bar = document.getElementById("timerFill");
  const percent = (timeLeft / QUESTION_TIME) * 100;
  bar.style.width = percent + "%";
  if(timeLeft <= 5){
    bar.classList.add("warning");
  }else{
    bar.classList.remove("warning");
  }
}

function timeUp(){
  lives--;
  combo = 0;
  const q = currentQuestions[qIndex];
  const options = document.querySelectorAll(".option");
  options.forEach(o=>{
    o.classList.add("disabled");
    const idx = String.fromCharCode(65) + ". ";
    if(o.innerText.startsWith(String.fromCharCode(65+q.a) + ". ")){
      o.classList.add("right");
    }
  });
  audioWrong.currentTime = 0;
  audioWrong.play();
  speakText("时间到，答错了");
  showExplain(q.explain);
}

// 选择答案
function chooseAnswer(el, idx, correctIdx, explain){
  stopTimer();
  const options = document.querySelectorAll(".option");
  options.forEach(o=>o.classList.add("disabled"));
  
  if(idx === correctIdx){
    el.classList.add("right");
    combo++;
    score += 10 + combo*2;
    correctCount++;
    audioCorrect.currentTime = 0;
    audioCorrect.play();
    speakText("答对了");
  }else{
    el.classList.add("wrong");
    lives--;
    combo = 0;
    options.forEach(o=>{
      const oIdx = o.innerText.charAt(0).charCodeAt(0) - 65;
      if(oIdx === correctIdx) o.classList.add("right");
    });
    audioWrong.currentTime = 0;
    audioWrong.play();
    speakText("答错了");
  }
  
  showExplain(explain);
}

function showExplain(text){
  document.getElementById("explainText").innerText = text;
  document.getElementById("explainPanel").classList.add("show");
}

function nextQuestion(){
  qIndex++;
  if(lives <= 0){
    showResult();
    return;
  }
  if(qIndex >= currentQuestions.length){
    showResult();
    return;
  }
  showQuestion();
}

function showResult(){
  stopTimer();
  let msg = "";
  if(lives > 0 && correctCount === currentQuestions.length){
    msg = "满分通关！历史小达人就是你！🎉";
  }else if(correctCount >= currentQuestions.length * 0.8){
    msg = "很不错！继续加油！👍";
  }else if(correctCount >= currentQuestions.length * 0.6){
    msg = "还可以，再复习一下错题！💪";
  }else{
    msg = "别灰心，回去再看看课本！📖";
  }
  document.getElementById("finalScore").innerText = score;
  document.getElementById("resultMsg").innerHTML = `答对了 ${correctCount}/${currentQuestions.length} 题<br>${msg}`;
  switchPage("pageResult");
  speakText("挑战完成，得分" + score);
}

function retryQuiz(){
  startQuiz(currentLesson);
}

function backToLessons(){
  renderLessons();
  switchPage("pageHome");
}

function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

// 防复制
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('copy', e=>e.preventDefault());

// 初始化
renderLessons();
</script>
