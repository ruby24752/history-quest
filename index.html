<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>历史闯关 · 七年级上册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5ecd7;
  --bg-deep:#e8d9b8;
  --surface:#fff8e7;
  --line:#d4b88a;
  --text:#3a2e1f;
  --text-2:#6b5a42;
  --accent:#9a3b2e;
  --accent-2:#7a2a20;
  --gold:#b8860b;
  --green:#4a7c59;
  --shadow:0 4px 20px rgba(139,90,43,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
body{
  font-family:"Noto Sans SC",sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:16px;
  position:relative;
  overflow-x:hidden;
}
/* 历史纹样背景 */
body::before{
  content:'';
  position:fixed;
  inset:0;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(154,59,46,.04) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(184,134,11,.04) 0%, transparent 50%);
  pointer-events:none;
  z-index:0;
}
/* 青铜纹装饰 */
body::after{
  content:'';
  position:fixed;
  top:0;left:0;right:0;
  height:8px;
  background:repeating-linear-gradient(90deg,
    var(--accent) 0px, var(--accent) 20px,
    var(--gold) 20px, var(--gold) 40px);
  opacity:.3;
  z-index:100;
}
.page{display:none;position:relative;z-index:1;}
.page.active{display:block;}

/* 标题 */
.header{
  text-align:center;
  padding:30px 20px 20px;
}
.header h1{
  font-family:"Noto Serif SC",serif;
  font-size:32px;
  color:var(--accent);
  margin-bottom:8px;
  letter-spacing:4px;
}
.header .seal{
  display:inline-block;
  background:var(--accent);
  color:#fff;
  padding:2px 12px;
  font-size:12px;
  border-radius:4px;
  margin-bottom:12px;
  letter-spacing:2px;
}
.header p{
  color:var(--text-2);
  font-size:14px;
  line-height:1.6;
}

/* 课程列表 */
.lesson-grid{
  max-width:800px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  padding:20px 0;
}
.lesson-card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:12px;
  padding:18px 20px;
  cursor:pointer;
  transition:all .3s;
  display:flex;
  align-items:center;
  gap:16px;
  box-shadow:var(--shadow);
}
.lesson-card:hover{
  transform:translateX(8px);
  border-color:var(--accent);
}
.lesson-num{
  width:44px;
  height:44px;
  background:var(--accent);
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Noto Serif SC",serif;
  font-weight:bold;
  font-size:18px;
  flex-shrink:0;
}
.lesson-info{flex:1;}
.lesson-title{
  font-size:16px;
  font-weight:600;
  color:var(--text);
  margin-bottom:4px;
}
.lesson-meta{
  font-size:12px;
  color:var(--text-2);
}
.lesson-arrow{
  color:var(--line-strong);
  font-size:20px;
}

/* 答题页 */
.quiz-box{
  max-width:700px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px;
  box-shadow:var(--shadow);
}
.quiz-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  gap:8px;
}
.quiz-header .lesson-name{
  font-size:14px;
  color:var(--accent);
  font-weight:600;
}
.quiz-stats{
  display:flex;
  gap:12px;
  font-size:13px;
  color:var(--text-2);
}
.quiz-stats span{
  background:var(--bg-deep);
  padding:4px 10px;
  border-radius:12px;
}
.timer-bar{
  height:6px;
  background:var(--bg-deep);
  border-radius:3px;
  margin-bottom:20px;
  overflow:hidden;
}
.timer-fill{
  height:100%;
  background:var(--green);
  border-radius:3px;
  transition:width .3s linear;
}
.timer-fill.warning{
  background:var(--accent);
}
.question{
  font-size:18px;
  line-height:1.6;
  margin-bottom:24px;
  font-weight:600;
}
.options{
  display:flex;
  flex-direction:column;
  gap:12px;
}
.option{
  padding:14px 18px;
  background:var(--bg);
  border:2px solid var(--line);
  border-radius:10px;
  cursor:pointer;
  transition:all .2s;
  font-size:15px;
  line-height:1.5;
}
.option:hover{
  border-color:var(--gold);
  background:var(--bg-deep);
}
.option.right{
  background:#e8f5e9;
  border-color:var(--green);
  color:#2e7d32;
}
.option.wrong{
  background:#ffebee;
  border-color:var(--accent);
  color:#c62828;
}
.option.disabled{pointer-events:none;}

/* 解析面板 */
.explain-panel{
  margin-top:20px;
  padding:16px;
  background:#fff8e1;
  border-left:4px solid var(--gold);
  border-radius:8px;
  display:none;
}
.explain-panel.show{display:block;}
.explain-title{
  font-weight:600;
  color:var(--gold);
  margin-bottom:8px;
  font-size:14px;
}
.explain-text{
  font-size:14px;
  line-height:1.7;
  color:var(--text-2);
}
.next-btn{
  display:block;
  width:100%;
  margin-top:16px;
  padding:14px;
  background:var(--accent);
  color:#fff;
  border:none;
  border-radius:25px;
  font-size:16px;
  cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;
}
.next-btn:hover{opacity:.9;}

/* 结果页 */
.result-box{
  max-width:500px;
  margin:0 auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:16px;
  padding:40px 30px;
  text-align:center;
  box-shadow:var(--shadow);
}
.result-box h2{
  font-family:"Noto Serif SC",serif;
  color:var(--accent);
  margin-bottom:20px;
  font-size:28px;
}
.result-score{
  font-size:48px;
  font-weight:900;
  color:var(--gold);
  margin:16px 0;
}
.result-msg{
  color:var(--text-2);
  line-height:1.8;
  margin-bottom:24px;
}
.result-btns{
  display:flex;
  gap:12px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  padding:12px 24px;
  border:none;
  border-radius:25px;
  font-size:15px;
  cursor:pointer;
  font-family:"Noto Sans SC",sans-serif;
}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--bg-deep);color:var(--text);}

/* 语音开关 */
.voice-toggle{
  position:fixed;
  top:20px;
  right:20px;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
  padding:6px 14px;
  font-size:12px;
  cursor:pointer;
  z-index:200;
  box-shadow:var(--shadow);
}
.voice-toggle.on{background:var(--green);color:#fff;border-color:var(--green);}

.tip{
  text-align:center;
  color:var(--text-2);
  font-size:12px;
  margin-top:20px;
}

@media (max-width:480px){
  .header h1{font-size:24px;}
  .lesson-card{padding:14px 16px;}
  .quiz-box{padding:18px;}
  .question{font-size:16px;}
}
</style>
</head>
<body>
<div class="voice-toggle on" id="voiceToggle" onclick="toggleVoice()">🔊 语音开</div>

<!-- 课程选择页 -->
<div id="pageHome" class="page active">
  <div class="header">
    <div class="seal">历史闯关</div>
    <h1>七上历史</h1>
    <p>按课选题 · 每题15秒 · 3条生命<br>答错显示解析 · 连击加分</p>
  </div>
  <div class="lesson-grid" id="lessonList"></div>
  <p class="tip">共20课 · 约180道常考选择题 · 防复制已开启</p>
</div>

<!-- 答题页 -->
<div id="pageQuiz" class="page">
  <div class="quiz-box">
    <div class="quiz-header">
      <span class="lesson-name" id="currentLesson"></span>
      <div class="quiz-stats">
        <span>第<span id="qNum">1</span>/<span id="qTotal">10</span>题</span>
        <span>❤️<span id="lives">3</span></span>
        <span>连击<span id="combo">0</span></span>
        <span>得分<span id="score">0</span></span>
      </div>
    </div>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="options"></div>
    <div class="explain-panel" id="explainPanel">
      <div class="explain-title">📖 考点解析</div>
      <div class="explain-text" id="explainText"></div>
      <button class="next-btn" onclick="nextQuestion()">下一题 →</button>
    </div>
  </div>
</div>

<!-- 结果页 -->
<div id="pageResult" class="page">
  <div class="result-box">
    <h2>闯关结束</h2>
    <div class="result-score" id="finalScore">0</div>
    <p class="result-msg" id="resultMsg"></p>
    <div class="result-btns">
      <button class="btn btn-primary" onclick="retryQuiz()">再考一次</button>
      <button class="btn btn-secondary" onclick="backToLessons()">返回课程列表</button>
    </div>
  </div>
</div>

<script>
// 音效资源
const audioCorrect = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3");
const audioWrong = new Audio("https://assets.mixkit.co/sfx/preview/mixkit-software-interface-error-2564.mp3");
audioCorrect.volume = 0.4;
audioWrong.volume = 0.4;

let voiceOn = true;
function toggleVoice(){
  voiceOn = !voiceOn;
  const btn = document.getElementById("voiceToggle");
  if(voiceOn){
    btn.classList.add("on");
    btn.innerText = "🔊 语音开";
  }else{
    btn.classList.remove("on");
    btn.innerText = "🔇 语音关";
  }
}

// 预加载语音列表
let zhVoice = null;
function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  // 优先选晓晓甜美女声
  zhVoice = voices.find(v=>v.name.includes("Xiaoxiao")) || 
            voices.find(v=>v.name.includes("Xiaoyi")) ||
            voices.find(v=>v.name.includes("Yunxia")) ||
            voices.find(v=>v.lang==="zh-CN");
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speakText(text){
  if(!voiceOn) return;
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  if(zhVoice) u.voice = zhVoice;
  u.rate = 1.0;    // 语速适中
  u.pitch = 1.3;   // 音调拉高，可爱感
  u.volume = 0.8;
  window.speechSynthesis.speak(u);
}

// 题库
const POOL = [
  // 第1课 远古人类
  {tag:"第1课 远古时期的人类活动", q:"我国境内目前已知最早的古人类之一是？", opts:["北京人","元谋人","山顶洞人","蓝田人"], a:1, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。北京人距今约70万—20万年，山顶洞人距今约3万年。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人生活的年代距今约？", opts:["170万年","70万年","3万年","100万年"], a:0, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人发现于今天的哪个省？", opts:["陕西省","云南省","北京市","湖北省"], a:1, explain:"元谋人发现于云南元谋县，因此得名“元谋人”。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人生活的地点是？", opts:["云南元谋","陕西蓝田","北京周口店龙骨山","浙江余姚"], a:2, explain:"北京人遗址位于北京西南周口店龙骨山上。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人生活的年代距今约？", opts:["约170万年","约70万—20万年","约3万年","约1万年"], a:1, explain:"北京人生活在距今约70万—20万年。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人使用的石器属于？", opts:["磨制石器","打制石器","玉器","陶器"], a:1, explain:"北京人制作石器的技术比较成熟，采用不同的打制方法，制作成不同类型的工具。"},
  {tag:"第1课 远古时期的人类活动", q:"使用打制石器的时代称为？", opts:["新石器时代","旧石器时代","青铜时代","铁器时代"], a:1, explain:"使用打制石器的时代，叫作旧石器时代。"},
  {tag:"第1课 远古时期的人类活动", q:"关于北京人用火，正确的是？", opts:["会人工取火","使用天然火并保存火种","不会用火","只会生火不会保存"], a:1, explain:"北京人已经学会使用火，还会长时间保存火种。"},
  {tag:"第1课 远古时期的人类活动", q:"山顶洞人生活的年代距今约？", opts:["170万年","70万年","3万年","7000年"], a:2, explain:"山顶洞人生活在距今约3万年。"},
  {tag:"第1课 远古时期的人类活动", q:"山顶洞人相比北京人，掌握的新技术是？", opts:["打制石器","磨光和钻孔技术","种植水稻","建造房屋"], a:1, explain:"山顶洞人已经掌握磨光和钻孔技术。"},
  {tag:"第1课 远古时期的人类活动", q:"已经懂得人工取火的远古人类是？", opts:["元谋人","北京人","山顶洞人","郧县人"], a:2, explain:"山顶洞人已经懂得人工取火。"},
  {tag:"第1课 远古时期的人类活动", q:"会制作骨针、有爱美意识的远古人类是？", opts:["北京人","元谋人","山顶洞人","半坡人"], a:2, explain:"山顶洞人有爱美意识，会缝制衣服。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人距今约多少年？", opts:["约170万年","约70万年","约3万年","约1万年"], a:0, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人遗址位于今天的哪个城市？", opts:["北京","西安","昆明","杭州"], a:0, explain:"北京人遗址位于北京西南周口店龙骨山上。"},
  {tag:"第1课 远古时期的人类活动", q:"使用打制石器的时代被称为？", opts:["新石器时代","旧石器时代","青铜时代","铁器时代"], a:1, explain:"使用打制石器的时代，叫作旧石器时代。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人已经学会使用火，还会长时间？", opts:["生火","保存火种","人工取火","钻木取火"], a:1, explain:"北京人已经学会使用火，还会长时间保存火种。"},
  {tag:"第1课 远古时期的人类活动", q:"火的使用对北京人的意义不包括？", opts:["烧烤食物","防寒保暖","驱赶野兽","种植水稻"], a:3, explain:"火可以用来烧烤食物、防寒保暖、驱赶野兽，增强了人类适应自然的能力。"},
  {tag:"第1课 远古时期的人类活动", q:"山顶洞人生活的集体是由什么关系结合起来的氏族？", opts:["血缘","地缘","财产","宗教"], a:0, explain:"山顶洞人生活的集体，是由血缘关系结合起来的氏族。"},
  {tag:"第1课 远古时期的人类活动", q:"下列关于北京人的说法，错误的是？", opts:["会制造和使用工具","使用天然火","过群居生活","会人工取火"], a:3, explain:"北京人使用天然火，会长时间保存火种，但还不会人工取火。山顶洞人才会人工取火。"},
  {tag:"第1课 远古时期的人类活动", q:"我国境内目前已确认的最早的古人类是？", opts:["北京人","元谋人","山顶洞人","半坡人"], a:1, explain:"元谋人距今约170万年，是我国境内目前已确认的最早古人类。"},
  {tag:"第1课 远古时期的人类活动", q:"周口店北京人遗址是迄今所知世界上内涵最丰富、材料最齐全的什么遗址之一？", opts:["直立人","早期智人","晚期智人","现代人"], a:0, explain:"周口店北京人遗址是迄今所知世界上内涵最丰富、材料最齐全的直立人遗址之一。"},
  {tag:"第1课 远古时期的人类活动", q:"下列远古人类中，模样和现代人基本相同的是？", opts:["元谋人","北京人","山顶洞人","蓝田人"], a:2, explain:"山顶洞人距今约3万年，模样和现代人基本相同。"},
  {tag:"第1课 远古时期的人类活动", q:"学会用火是人类进化史上的里程碑。下列远古人类中，已经学会使用火的是？", opts:["元谋人","北京人","山顶洞人","以上都是"], a:3, explain:"元谋人、北京人、山顶洞人都已经学会使用火，北京人还会长时间保存火种，山顶洞人更会人工取火。"},
  {tag:"第1课 远古时期的人类活动", q:"考古人员在北京人遗址中发现了大量木炭和几处较大的灰烬堆，这说明北京人？", opts:["会建造房屋","会使用天然火","会制造彩陶","会种植水稻"], a:1, explain:"灰烬堆说明北京人会使用天然火，还会长时间保存火种。"},
  {tag:"第1课 远古时期的人类活动", q:"下列哪一项不是北京人和山顶洞人的共同点？", opts:["都居住在北京周口店","都使用打制石器","都已经会人工取火","都过集体生活"], a:2, explain:"北京人使用天然火，山顶洞人才会人工取火，这不是他们的共同点。"},
  {tag:"第1课 远古时期的人类活动", q:"北京人能够制造和使用的工具是？", opts:["磨制石器","打制石器","青铜器","铁器"], a:1, explain:"北京人制作石器的技术比较成熟，采用不同的打制方法，制作成不同类型的工具。"},
  {tag:"第1课 远古时期的人类活动", q:"远古人类最早使用的工具是？", opts:["打制石器","磨制石器","青铜器","铁器"], a:0, explain:"远古人类最早使用打制石器，使用打制石器的时代叫旧石器时代。"},
  {tag:"第1课 远古时期的人类活动", q:"元谋人、北京人、山顶洞人生活的时期属于？", opts:["旧石器时代","新石器时代","青铜时代","铁器时代"], a:0, explain:"他们都使用打制石器，属于旧石器时代。"},
  {tag:"第1课 远古时期的人类活动", q:"下列关于山顶洞人的说法，正确的是？", opts:["生活在距今约70万—20万年","使用打制石器，不会磨光钻孔","已经懂得人工取火","保留了猿的某些特征"], a:2, explain:"山顶洞人生活在距今约3万年，已经懂得人工取火，模样和现代人基本相同。"},

  {tag:"第2课 原始农业与史前社会", q:"半坡居民居住的房屋样式是？", opts:["干栏式建筑","半地穴式圆形房屋","高架屋","砖瓦房"], a:1, explain:"半坡人居住半地穴式圆形房屋，保暖防风。"},

  {tag:"第2课 原始农业与史前社会", q:"河姆渡居民能够种植水稻，主要是因为？", opts:["长江流域气候温暖湿润，适合水稻生长","他们从国外引进的水稻","黄河流域适合种水稻","他们会做水稻"], a:0, explain:"河姆渡位于长江流域，气候温暖湿润，适合水稻生长。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡居民居住半地穴式房屋，主要是因为？", opts:["黄河流域气候寒冷干燥，半地穴式房屋可以保暖防风","他们喜欢住地下","长江流域潮湿","没有木头"], a:0, explain:"半坡位于黄河流域，气候寒冷干燥，半地穴式房屋可以保暖防风。"},
  {tag:"第2课 原始农业与史前社会", q:"下列哪一项不是河姆渡居民的生产生活情况？", opts:["种植水稻","住干栏式房屋","使用骨耜","种植粟"], a:3, explain:"河姆渡居民种植水稻，半坡居民才种植粟。"},

  {tag:"第2课 原始农业与史前社会", q:"我国是世界上最早种植什么农作物的国家之一？", opts:["水稻和粟","小麦和玉米","水稻和小麦","粟和玉米"], a:0, explain:"河姆渡种水稻，半坡种粟，我国是世界上最早种植水稻和粟的国家之一。"},
  {tag:"第2课 原始农业与史前社会", q:"河姆渡遗址和半坡遗址分别位于？", opts:["长江流域和黄河流域","黄河流域和长江流域","都在长江流域","都在黄河流域"], a:0, explain:"河姆渡在长江流域（浙江余姚），半坡在黄河流域（陕西西安）。"},

  {tag:"第2课 原始农业与史前社会", q:"下列关于河姆渡和半坡居民的说法，错误的是？", opts:["都使用磨制石器","都过定居生活","都种植水稻","都会制作陶器"], a:2, explain:"半坡居民种植粟，不是水稻，所以C错误。"},
  {tag:"第2课 原始农业与史前社会", q:"决定河姆渡和半坡居民种植不同农作物、建造不同房屋的根本因素是？", opts:["自然地理环境","饮食习惯","生产工具","审美观念"], a:0, explain:"长江流域温暖湿润适合种水稻、住干栏式；黄河流域干燥寒冷适合种粟、住半地穴式，根本因素是自然地理环境。"},

  {tag:"第2课 原始农业与史前社会", q:"考古学家在河姆渡遗址发现了大量稻谷、稻秆和稻叶的堆积层，这证明了？", opts:["我国是世界上最早种植水稻的国家之一","河姆渡人喜欢吃米饭","水稻是从国外传来的","当时已经有稻子贸易"], a:0, explain:"大量稻谷堆积层证明河姆渡人已经种植水稻，我国是世界上最早种植水稻的国家之一。"},
  {tag:"第2课 原始农业与史前社会", q:"半坡遗址出土的骨针、骨锥等工具，说明半坡人已经会？", opts:["缝制衣服","种植水稻","建造房屋","制作彩陶"], a:0, explain:"骨针、骨锥等工具说明半坡人已经会缝制衣服。"},

  {tag:"第3课 中华文明的起源", q:"黄帝和炎帝之间进行的战役是？", opts:["涿鹿之战","阪泉之战","牧野之战","巨鹿之战"], a:1, explain:"黄帝和炎帝在阪泉之战中打败炎帝，两大部落结成联盟。"},
  {tag:"第3课 中华文明的起源", q:"炎黄部落打败蚩尤部落的战役是？", opts:["阪泉之战","涿鹿之战","长平之战","桂陵之战"], a:1, explain:"炎黄部落在涿鹿之战中打败蚩尤部落，联盟逐渐形成华夏族。"},
  {tag:"第3课 中华文明的起源", q:"尧、舜、禹时期，将联盟首领位子传给贤德之人的制度是？", opts:["世袭制","禅让制","分封制","郡县制"], a:1, explain:"禅让制是将部落联盟首领位子传给贤德之人的制度。"},
  {tag:"第3课 中华文明的起源", q:"禅让制推举部落联盟首领的标准是？", opts:["血缘亲疏","贤德与才能","财富多少","武力强弱"], a:1, explain:"禅让制推举的标准是贤德与才能。"},

  {tag:"第3课 中华文明的起源", q:"大禹治水采用的主要方法是？", opts:["堵塞","疏导","抽干","迁移"], a:1, explain:"禹采用疏导的方法，开凿河渠疏导洪水入海。"},

  {tag:"第3课 中华文明的起源", q:"良渚古城最具代表性的礼器是？", opts:["人面鱼纹彩陶盆","玉琮、玉钺","铁剑","甲骨"], a:1, explain:"良渚古城出土了玉器，如琮、璧、钺等，代表了当时的礼仪制度。"},

  // 第4课 夏商周更替
  {tag:"第3课 中华文明的起源", q:"我们自称“炎黄子孙”，主要是因为？", opts:["炎帝和黄帝是我国传说中黄河流域著名的部落首领","炎帝和黄帝联合打败了蚩尤","炎黄联盟以后逐渐形成华夏族，是汉族的前身","炎帝和黄帝有很多发明创造"], a:2, explain:"炎黄部落联盟以后逐渐形成为华夏族，后人尊崇炎帝和黄帝为中华民族的人文初祖，海内外华人也以“炎黄子孙”自称。"},
  {tag:"第3课 中华文明的起源", q:"下列哪一项不是黄帝的发明？", opts:["建造宫室","制作衣裳","挖掘水井","发明文字"], a:3, explain:"相传黄帝建造宫室，制作衣裳，挖掘水井，制造船只，会炼铜，发明了弓箭。创造文字的是仓颉，不是黄帝。"},
  {tag:"第3课 中华文明的起源", q:"传说中，发明文字的是？", opts:["嫘祖","仓颉","伶伦","隶首"], a:1, explain:"相传仓颉创造了文字，伶伦制作了音律，隶首发明了算盘，嫘祖会缫丝，擅长纺织。"},
  {tag:"第3课 中华文明的起源", q:"下列关于禅让制的说法，正确的是？", opts:["是夏朝建立后的制度","是将部落联盟首领位子传给贤德之人的制度","是将王位传给儿子的制度","是西周的分封制"], a:1, explain:"禅让制是尧、舜、禹时期，将部落联盟首领位子传给贤德之人的制度。"},
  {tag:"第3课 中华文明的起源", q:"禅让制结束的标志是？", opts:["禹建立夏朝","启继承王位","商汤灭夏","武王伐纣"], a:1, explain:"禹死后，他的儿子启继承王位，世袭制代替了禅让制，“公天下”变成了“家天下”。"},
  {tag:"第3课 中华文明的起源", q:"“公天下”变成“家天下”的标志是？", opts:["禅让制的实行","世袭制的实行","分封制的实行","郡县制的实行"], a:1, explain:"禹死后，启继承父位，成为夏朝第二代国王，世袭制代替了禅让制，“公天下”变成了“家天下”。"},
  {tag:"第3课 中华文明的起源", q:"大禹治水成功的主要原因是？", opts:["采用疏导的方法，团结民众","用堵塞的方法","他有很多军队","他是部落首领"], a:0, explain:"禹采用疏导的方法，开凿河渠疏导洪水入海，并且全身心投入，三过家门而不入，终于治水成功。"},
  {tag:"第3课 中华文明的起源", q:"被称为“人文初祖”的是？", opts:["炎帝和黄帝","尧和舜","禹和启","秦始皇"], a:0, explain:"炎帝和黄帝部落联盟以后逐渐形成华夏族，后人尊崇炎帝和黄帝为中华民族的人文初祖。"},
  {tag:"第3课 中华文明的起源", q:"阪泉之战和涿鹿之战的先后顺序是？", opts:["先阪泉之战，后涿鹿之战","先涿鹿之战，后阪泉之战","两场战争同时进行","没有先后顺序"], a:0, explain:"先有黄帝和炎帝之间的阪泉之战，两大部落结成联盟，然后炎黄部落在涿鹿之战中打败蚩尤。"},
  {tag:"第3课 中华文明的起源", q:"下列哪一传说反映了当时已经出现阶级分化和私有制？", opts:["禅让制","大禹治水","良渚古城的玉器和大型墓葬","涿鹿之战"], a:2, explain:"良渚古城有大型墓葬和精美玉器，说明当时已经出现阶级分化和私有制，早期国家已经出现。"},
  {tag:"第3课 中华文明的起源", q:"我们了解黄帝、炎帝时期的历史，主要依据是？", opts:["考古发现","史书记载","传说和考古发现","学者推测"], a:2, explain:"黄帝、炎帝时期属于传说时代，我们主要通过传说和考古发现来了解当时的历史。"},
  {tag:"第3课 中华文明的起源", q:"尧、舜、禹先后成为部落联盟首领，这反映了当时的什么制度？", opts:["世袭制","禅让制","分封制","郡县制"], a:1, explain:"尧传舜，舜传禹，都是通过禅让制，传位给贤德之人。"},
  {tag:"第3课 中华文明的起源", q:"下列关于炎帝和黄帝的说法，错误的是？", opts:["炎帝和黄帝是黄河流域的部落联盟首领","炎黄联盟在涿鹿之战中打败蚩尤","炎帝和黄帝被尊崇为人文初祖","炎帝和黄帝是夏朝的建立者"], a:3, explain:"夏朝的建立者是禹，不是炎帝和黄帝，所以D错误。"},
  {tag:"第3课 中华文明的起源", q:"大禹治水的事迹，我们可以从哪部古书中找到记载？", opts:["《史记》","《论语》","《道德经》","《孙子兵法》"], a:0, explain:"《史记》中记载了大禹治水的事迹。"},
  {tag:"第3课 中华文明的起源", q:"我国是世界上发现远古人类遗址最多的国家，说明中华文明？", opts:["源远流长","博大精深","都是外来的","只有黄河流域"], a:0, explain:"我国境内从元谋人、北京人到河姆渡、半坡，再到炎黄传说，历史悠久，说明中华文明源远流长。"},

  {tag:"第4课 夏商西周王朝的更替", q:"中国历史上第一个王朝是？", opts:["夏朝","商朝","西周","秦朝"], a:0, explain:"约公元前2070年，禹建立夏王朝，这是中国历史上第一个王朝。"},

  {tag:"第4课 夏商西周王朝的更替", q:"“家天下”取代“公天下”开始于？", opts:["禹传位给启","汤灭夏","武王伐纣","盘庚迁殷"], a:0, explain:"禹死后，启继承父位，世袭制代替了禅让制，“公天下”变成了“家天下”。"},

  {tag:"第8课 夏商周时期的科技与文化", q:"下列关于甲骨文的叙述，不正确的是？", opts:["19世纪末，学者王懿荣首次发现","它是一种成熟文字","它出土于河南安阳殷墟","它主要是夏朝的文字"], a:3, explain:"甲骨文主要是商朝的文字，不是夏朝的，所以D错误。"},

  {tag:"第10课 秦末农民大起义", q:"秦末农民战争中，对推翻秦朝统治起决定性作用的战役是？", opts:["巨鹿之战","长平之战","城濮之战","桂陵之战"], a:0, explain:"巨鹿之战歼灭了秦军主力，对推翻秦朝统治起了决定性作用。"},

  {tag:"第10课 秦末农民大起义", q:"下列历史事件按时间先后顺序排列正确的是？①陈胜吴广起义 ②巨鹿之战 ③秦朝灭亡 ④楚汉之争", opts:["①②③④","①③②④","②①③④","①②④③"], a:0, explain:"①公元前209年陈胜吴广起义，②公元前207年巨鹿之战，③公元前207年秦朝灭亡，④公元前206-前202年楚汉之争。"},

  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，统一铸造的货币是？", opts:["半两钱","五铢钱","刀币","布币"], a:1, explain:"汉武帝把铸币权收归中央，统一铸造五铢钱。"},

  {tag:"第13课 东汉的兴衰", q:"光武帝统治时期，社会出现了比较安定的局面，经济得到恢复和发展，历史上称为？", opts:["文景之治","光武中兴","贞观之治","开元盛世"], a:1, explain:"光武帝刘秀统治时期，社会出现了比较安定的局面，经济得到恢复和发展，历史上称为“光武中兴”。"},
  {tag:"第13课 东汉的兴衰", q:"光武帝为了巩固统治，采取了一系列措施，不包括？", opts:["释放奴婢，减轻农民的负担","减轻刑罚","合并郡县，裁减官员","实行分封制"], a:3, explain:"光武帝释放奴婢，减轻农民的负担，减轻刑罚，合并郡县，裁减官员，加强对官吏的监督，惩处贪官污吏，允许北方少数民族内迁，缓和民族矛盾。"},
  {tag:"第13课 东汉的兴衰", opts:["皇帝年幼，外戚宦官交替专权","国家统一，政治清明","经济繁荣，文化昌盛","外敌入侵，战争频繁"], a:0, explain:"东汉中期以后，继位的皇帝大多年幼，无法主政，大权就由皇帝的母亲太后主持，太后重用自己的亲戚，导致外戚的权力膨胀。皇帝长大后，依赖身边的宦官，除掉外戚，宦官又把持朝政，这样就出现了外戚宦官交替专权的局面。"},
  {tag:"第13课 东汉的兴衰", opts:["动摇了东汉的统治，东汉王朝走向衰亡","加强了中央集权","加强了皇权","促进了经济发展"], a:0, explain:"外戚宦官交替专权，任用亲信，诛杀异己，导致政治腐朽不堪，正直的官员受到排挤陷害，社会混乱，人民遭殃，动摇了东汉的统治，东汉王朝走向衰亡。"},
  {tag:"第13课 东汉的兴衰", opts:["陈胜吴广起义","黄巾起义","黄巢起义","李自成起义"], a:1, explain:"184年，张角领导的黄巾起义，是一场有组织、有准备的农民大起义。"},
  {tag:"第13课 东汉的兴衰", opts:["陈胜","吴广","张角","张梁"], a:2, explain:"184年，张角领导黄巾起义，起义军头裹黄巾，被称为“黄巾军”。"},
  {tag:"第13课 东汉的兴衰", opts:["公元前209年","184年","200年","220年"], a:1, explain:"184年，张角领导黄巾起义，沉重打击了东汉的统治。"},
  {tag:"第13课 东汉的兴衰", opts:["沉重打击了东汉的统治，使其一蹶不振","推翻了东汉的统治","建立了新的王朝","统一了全国"], a:0, explain:"黄巾起义虽然最后失败了，但沉重打击了东汉的统治，使其一蹶不振。"},
  {tag:"第13课 东汉的兴衰", opts:["张衡","蔡伦","华佗","张仲景"], a:1, explain:"东汉时，宦官蔡伦总结前人经验，改进造纸工艺，用树皮、麻头、破布、旧渔网等植物纤维为原料造纸。"},
  {tag:"第13课 东汉的兴衰", opts:["西汉时期","东汉时期","秦朝","唐朝"], a:1, explain:"东汉时，宦官蔡伦总结前人经验，改进造纸工艺，纸的质量大大提高。"},
  {tag:"第13课 东汉的兴衰", opts:["树皮","麻头","破布","竹子"], a:3, explain:"蔡伦用树皮、麻头、破布、旧渔网等植物纤维为原料造纸，不是竹子。"},
  {tag:"第13课 东汉的兴衰", opts:["便利了典籍的流传","促进了文化的传播和发展","是中国对世界文明的伟大贡献之一","以上都是"], a:3, explain:"造纸术的发明和改进，便利了典籍的流传，促进了文化的传播和发展，是中国对世界文明的伟大贡献之一。"},
  {tag:"第13课 东汉的兴衰", opts:["张衡","蔡伦","华佗","张仲景"], a:0, explain:"东汉科学家张衡发明了世界上最早的地震仪器——地动仪。"},
  {tag:"第13课 东汉的兴衰", opts:["张仲景","华佗","扁鹊","李时珍"], a:0, explain:"东汉末年，张仲景写成了《伤寒杂病论》，全面阐述了中医的理论和治病原则，被后世称为“医圣”。"},
  {tag:"第13课 东汉的兴衰", opts:["《伤寒杂病论》","《黄帝内经》","《本草纲目》","《千金方》"], a:0, explain:"张仲景写成了《伤寒杂病论》，全面阐述了中医的理论和治病原则。"},
  {tag:"第13课 东汉的兴衰", opts:["张仲景","华佗","扁鹊","李时珍"], a:1, explain:"东汉末年的华佗，发明了“麻沸散”，让病人和酒服下，失去知觉，然后进行各种手术。"},
  {tag:"第13课 东汉的兴衰", opts:["麻醉","退烧","止泻","止咳"], a:0, explain:"“麻沸散”是世界上最早使用的麻醉剂，华佗是世界上最早用全身麻醉方法做手术的医生。"},

  {tag:"第14课 丝绸之路的开通与经营", q:"两次出使西域，为丝绸之路开通奠定基础的是？", opts:["张骞","班超","甘英","玄奘"], a:0, explain:"公元前138年和公元前119年，张骞两次出使西域，打通了汉朝通往西域的道路，为丝绸之路的开通奠定了基础。"},
  {tag:"第14课 丝绸之路的开通与经营", q:"丝绸之路的起点是？", opts:["洛阳","长安","咸阳","敦煌"], a:1, explain:"丝绸之路从长安出发，穿过河西走廊，经西域运往中亚、西亚，再转运到更远的欧洲。"},
  {tag:"第14课 丝绸之路的开通与经营", q:"东汉时期，出使西域，经营西域30多年的是？", opts:["张骞","班超","甘英","司马迁"], a:1, explain:"东汉明帝时，派班超出使西域，班超在西域经营30多年，为西域与汉朝的联系做出了重要贡献。"},

  // 第14课 东汉的兴亡
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，接受谁的建议，“罢黜百家，独尊儒术”？", opts:["李斯","董仲舒","主父偃","卫青"], a:1, explain:"汉武帝接受董仲舒“罢黜百家，独尊儒术”的建议，把儒家学说立为正统思想。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝为削弱诸侯王势力，采取的措施是？", opts:["分封制","推恩令","郡县制","科举制"], a:1, explain:"汉武帝采纳主父偃的“推恩”建议，下诏规定诸侯王除以嫡长子继承王位外，可将封地再次分封给其子弟作为侯国，由皇帝制定封号。"},
  {tag:"第12课 大一统王朝的巩固", q:"“推恩令”的作用是？", opts:["削弱了诸侯王的势力，加强了中央对地方的控制","加强了诸侯王的势力","削弱了皇帝的权力","加强了丞相的权力"], a:0, explain:"推恩令实行后，诸侯王的封地和势力越来越小，中央对地方的控制大大加强。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝为监视地方官吏、豪强及其子弟，建立了什么制度？", opts:["刺史制度","郡县制","分封制","科举制"], a:0, explain:"汉武帝建立刺史制度，把全国划分为13个州部，每州部派刺史一人，代表朝廷监视州部内的地方官吏、豪强及其子弟。"},
  {tag:"第12课 大一统王朝的巩固", q:"“罢黜百家，独尊儒术”的建议是谁提出的？", opts:["李斯","董仲舒","主父偃","卫青"], a:1, explain:"汉武帝接受董仲舒“罢黜百家，独尊儒术”的建议，把儒家学说立为正统思想。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，在长安兴办的最高学府是？", opts:["太学","国子监","翰林院","书院"], a:0, explain:"汉武帝在长安兴办太学，以儒家的《诗》《书》《礼》《易》《春秋》作为教材，培养统治阶级需要的儒学人才。"},
  {tag:"第12课 大一统王朝的巩固", q:"儒家学说立为正统思想，始于哪个朝代？", opts:["秦朝","西汉","东汉","唐朝"], a:1, explain:"汉武帝时期，“罢黜百家，独尊儒术”，把儒家学说立为正统思想，居于主导地位，为历代王朝所推崇。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，统一铸造的货币是？", opts:["半两钱","五铢钱","刀币","布币"], a:1, explain:"汉武帝把铸币权收归中央，统一铸造五铢钱。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，为了加强对社会经济的控制，实行了什么政策？", opts:["盐铁官营、专卖","统一铸币","平抑物价","以上都是"], a:3, explain:"汉武帝把铸币权收归中央，统一铸造五铢钱；实行盐铁官营、专卖；在全国范围内统一调配物资，平抑物价。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，率军北击匈奴的著名将领是？", opts:["卫青、霍去病","陈胜、吴广","项羽、刘邦","刘备、诸葛亮"], a:0, explain:"汉武帝派大将卫青、霍去病北击匈奴，使匈奴无力再与西汉对抗。"},
  {tag:"第12课 大一统王朝的巩固", q:"公元前119年，汉武帝派谁北击匈奴，使匈奴无力再与西汉对抗？", opts:["卫青、霍去病","蒙恬","李斯","主父偃"], a:0, explain:"公元前119年，汉武帝派大将卫青、霍去病率精骑出击匈奴，大胜而归，匈奴无力再与西汉对抗。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，西汉王朝进入鼎盛时期，这一时期被称为？", opts:["文景之治","光武中兴","汉武帝大一统","贞观之治"], a:2, explain:"汉武帝从政治、思想、经济和军事等方面巩固了大一统的局面，使西汉王朝开始进入鼎盛时期。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝在政治上巩固大一统的措施是？", opts:["推恩令","刺史制度","建立察举制","以上都是"], a:3, explain:"汉武帝在政治上，实施推恩令，建立刺史制度，建立察举制，选拔人才。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝在思想上巩固大一统的措施是？", opts:["“罢黜百家，独尊儒术”","兴办太学","以儒家经典为教材","以上都是"], a:3, explain:"汉武帝在思想上，“罢黜百家，独尊儒术”，兴办太学，以儒家经典为教材，把儒家学说立为正统思想。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝在经济上巩固大一统的措施是？", opts:["统一铸币","盐铁官营、专卖","平抑物价","以上都是"], a:3, explain:"汉武帝在经济上，把铸币权收归中央，统一铸造五铢钱；实行盐铁官营、专卖；平抑物价。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝在军事上巩固大一统的措施是？", opts:["北击匈奴","修筑长城","派人出使西域","以上都是"], a:0, explain:"汉武帝在军事上，派卫青、霍去病北击匈奴，使匈奴无力再与西汉对抗。"},
  {tag:"第12课 大一统王朝的巩固", q:"“推恩令”的巧妙之处在于？", opts:["不费一兵一卒，就削弱了诸侯王的势力","得到了诸侯王子弟的支持","加强了中央集权","以上都是"], a:3, explain:"推恩令允许诸侯王把封地分给子弟，建立小侯国，不费一兵一卒就削弱了诸侯王的势力，还得到了诸侯王子弟的支持，加强了中央集权。"},
  {tag:"第12课 大一统王朝的巩固", q:"下列哪项不是汉武帝大一统的措施？", opts:["“罢黜百家，独尊儒术”","实行推恩令","统一铸造五铢钱","实行分封制"], a:3, explain:"实行分封制是西周的制度，汉武帝实行的是推恩令和刺史制度，不是分封制。"},
  {tag:"第12课 大一统王朝的巩固", q:"汉武帝时期，西汉进入鼎盛时期，他是西汉的第几位皇帝？", opts:["第3位","第5位","第7位","第9位"], a:1, explain:"汉武帝刘彻是西汉的第5位皇帝，他在位期间，西汉王朝进入鼎盛时期。"},
  {tag:"第12课 大一统王朝的巩固", q:"儒家思想成为中国封建社会的正统思想，开始于？", opts:["秦始皇","汉高祖","汉武帝","光武帝"], a:2, explain:"汉武帝时期，“罢黜百家，独尊儒术”，儒家学说立为正统思想，成为中国封建社会的正统思想。"},

  {tag:"第13课 东汉的兴衰", q:"东汉的建立者是？", opts:["刘邦","刘彻","刘秀","刘备"], a:2, explain:"公元25年，刘秀称帝，定都洛阳，史称东汉，刘秀就是光武帝。"},
  {tag:"第13课 东汉的兴衰", q:"东汉建立的时间是？", opts:["公元前202年","公元9年","公元25年","公元220年"], a:2, explain:"公元25年，刘秀称帝，定都洛阳，史称东汉。"},
  {tag:"第13课 东汉的兴衰", q:"东汉时期，改进造纸术的是？", opts:["张衡","蔡伦","华佗","张仲景"], a:1, explain:"东汉时，宦官蔡伦总结前人经验，改进造纸工艺，用树皮、麻头、破布、旧渔网等植物纤维为原料造纸。"},

  {tag:"第14课 丝绸之路的开通与经营", opts:["联络大月氏夹击匈奴","访问西域各国","开通丝绸之路","传播汉朝文化"], a:0, explain:"公元前138年，汉武帝派张骞出使西域，目的是联络大月氏夹击匈奴。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["联络大月氏夹击匈奴","访问西域各国，加强汉朝与西域的联系","开通丝绸之路","传播汉朝文化"], a:1, explain:"公元前119年，张骞第二次出使西域，访问西域各国，加强了汉朝与西域的相互了解与往来。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["洛阳","长安","咸阳","敦煌"], a:1, explain:"丝绸之路从长安出发，穿过河西走廊，经西域运往中亚、西亚，再转运到更远的欧洲。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["长安→河西走廊→西域→中亚、西亚→欧洲","长安→西域→河西走廊→欧洲","洛阳→河西走廊→西域→欧洲","长安→西域→中亚→欧洲"], a:0, explain:"丝绸之路从长安出发，穿过河西走廊，经西域运往中亚、西亚，再转运到更远的欧洲。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["冶铁","凿井","造纸","佛教"], a:3, explain:"佛教是从西方传到中国的，不是从中国传到西方的。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["核桃","葡萄","石榴","丝绸"], a:3, explain:"丝绸是中国的特产，通过丝绸之路从中国传到西方，不是从西方传到中国的。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["有力地促进了中西方经济文化交流","加强了汉朝对西域的管理","丰富了中西方人民的生活","以上都是"], a:3, explain:"丝绸之路的开辟，有力地促进了中西方经济文化交流，加强了汉朝对西域的管理，丰富了中西方人民的生活。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["张骞出使西域","西域都护的设置","班超经营西域","甘英出使大秦"], a:1, explain:"公元前60年，西汉朝廷设置西域都护，作为管理西域的最高长官，管辖西域36国，都护府设在乌垒城，标志着西域正式归属中央政权。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["秦朝","西汉","东汉","唐朝"], a:1, explain:"公元前60年，西汉朝廷设置西域都护，标志着西域正式归属中央政权。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["西藏","新疆","内蒙古","云南"], a:1, explain:"西域都护的设置，说明今新疆及巴尔喀什湖以东、以南的广大地区正式成为我国领土不可分割的一部分。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["张骞","班超","甘英","司马迁"], a:1, explain:"东汉明帝时，派班超出使西域，班超在西域经营30多年，为西域与汉朝的联系做出了重要贡献。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["张骞","甘英","班固","班勇"], a:1, explain:"班超派甘英出使大秦，甘英到达了安息等国，为以后中西交通的发展提供了重要资料。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["长安","洛阳","东南沿海港口","广州"], a:2, explain:"汉代的海上丝绸之路从东南沿海港口出发，经中南半岛南下，绕过马来半岛，穿过马六甲海峡，通往孟加拉湾沿岸，最远抵达印度半岛南端和锡兰。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["促进了汉朝与西域之间的相互了解与往来","为丝绸之路的开通奠定了基础","开辟了中西交通的新纪元","以上都是"], a:3, explain:"张骞通西域，促进了汉朝与西域之间的相互了解与往来，为丝绸之路的开通奠定了基础，开辟了中西交通的新纪元。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["西域","中亚","西亚","欧洲"], a:0, explain:"汉代人把今天甘肃玉门关、阳关以西，也就是现在新疆和更远的广大地区称作西域。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["张骞通西域","丝绸之路","玄奘西行","郑和下西洋"], a:1, explain:"“一带一路”最早的雏形是汉代开通的丝绸之路。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["葡萄","核桃","石榴","水稻"], a:3, explain:"水稻是中国本土的农作物，半坡人就种植粟，河姆渡人就种植水稻，不是从西域传入的。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["加强了汉朝对西域的管理","促进了中西方经济文化交流","丰富了中西方人民的生活","维护了西域的稳定"], a:1, explain:"丝绸之路的开通，最大的意义是促进了中西方经济文化交流，对中国和其他国家和地区的贸易与文化交流，起到了极大的促进作用。"},
  {tag:"第14课 丝绸之路的开通与经营", opts:["开通道路","开凿隧道","出使西域","探险"], a:0, explain:"司马迁把张骞出使西域称为“凿空”，意思是开通道路。"},

  {tag:"第15课 秦汉时期的科技与文化", q:"张仲景的医学著作是？", opts:["《伤寒杂病论》","《本草纲目》","《黄帝内经》","《千金方》"], a:0, explain:"张仲景是东汉末年的名医，他虚心向名医求教，四处奔走，广泛收集民间药方，在总结前人经验的基础上，结合自己的临床实践，写成了《伤寒杂病论》一书。"},
  {tag:"第15课 秦汉时期的科技与文化", q:"被后世称为“医圣”的是？", opts:["华佗","张仲景","李时珍","扁鹊"], a:1, explain:"张仲景是中医临床理论体系的开创者，为中医药学的发展作出巨大贡献，他医术精湛，医德高尚，被后世称为“医圣”。"},
  {tag:"第15课 秦汉时期的科技与文化", q:"发明了“麻沸散”的名医是？", opts:["张仲景","华佗","李时珍","孙思邈"], a:1, explain:"华佗是东汉末年的名医，他不仅擅长用针灸、汤药为人治病，而且能实施外科手术，他发明了“麻沸散”。"},
  {tag:"第15课 秦汉时期的科技与文化", q:"我国第一部纪传体通史是？", opts:["《春秋》","《史记》","《汉书》","《资治通鉴》"], a:1, explain:"《史记》是我国第一部纪传体通史，记述了从传说中的黄帝到汉武帝时约3000年的史事。"},
  {tag:"第15课 秦汉时期的科技与文化", q:"《史记》的作者是？", opts:["司马迁","司马光","班固","班超"], a:0, explain:"《史记》的作者是司马迁，他是我国古代伟大的史学家。"},

  {tag:"第15课 秦汉时期的科技与文化", opts:["张仲景","华佗","李时珍","孙思邈"], a:1, explain:"华佗是东汉末年的名医，他不仅擅长用针灸、汤药为人治病，而且能实施外科手术，他发明了“麻沸散”。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["五禽戏","太极拳","八段锦","气功"], a:0, explain:"华佗还发明了“五禽戏”，通过模仿虎、鹿、熊、猿、鸟五种动物的活动姿态，帮助人们强身健体。"},

  {tag:"第15课 秦汉时期的科技与文化", opts:["是我国第一部纪传体通史","开创了纪传体史书的体例","对中国的史学发展产生了深远的影响","以上都是"], a:3, explain:"《史记》是我国第一部纪传体通史，开创了纪传体史书的体例，对中国的史学发展产生了深远的影响。"},

  {tag:"第15课 秦汉时期的科技与文化", opts:["佛教","道教","基督教","伊斯兰教"], a:1, explain:"道教是我国土生土长的宗教，东汉时期，道教在民间兴起，创始人之一叫张陵。"},

  {tag:"第15课 秦汉时期的科技与文化", opts:["白马寺","少林寺","灵隐寺","相国寺"], a:0, explain:"东汉明帝时，派人去西域求佛法，在洛阳建造了我国第一座佛教寺院——白马寺。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["丰富了我国的文化","对我国的思想、文化、艺术等方面都产生了深远的影响","促进了中外文化交流","以上都是"], a:3, explain:"佛教传入和道教兴起，丰富了我国的文化，对我国的思想、文化、艺术等方面都产生了深远的影响，促进了中外文化交流。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["造纸术","《史记》","地动仪","活字印刷术"], a:3, explain:"活字印刷术是北宋毕昇发明的，不是秦汉时期的成就。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["西汉","东汉","秦朝","唐朝"], a:1, explain:"东汉时，宦官蔡伦总结前人经验，改进造纸工艺，纸的质量大大提高。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["测定地震方位","测定方向","测定时间","测定距离"], a:0, explain:"张衡发明的地动仪，是世界上公认的最早的地震仪器，用来测定地震的方位。"},
  {tag:"第15课 秦汉时期的科技与文化", opts:["造纸术","地动仪","《史记》","麻沸散"], a:0, explain:"造纸术的发明和改进，便利了典籍的流传，促进了文化的传播和发展，是中国对世界文明的伟大贡献之一。"},

  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["争夺中央政权","反抗西晋统治","反抗少数民族","反抗皇帝"], a:0, explain:"“八王之乱”是手握重兵的八个封王为了争夺中央政权而进行的混战。"},
  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["促进了民族交融","促进了北方经济的发展","加速了西晋的灭亡","以上都是"], a:3, explain:"北方少数民族内迁，促进了民族交融，也促进了北方经济的发展，但同时也加剧了西晋的统治危机，加速了西晋的灭亡。"},
  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["36年","50年","60年","80年"], a:0, explain:"280年西晋统一全国，316年灭亡，只维持了36年。"},
  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["266年司马炎建立","280年统一全国","定都洛阳","是一个长治久安的王朝"], a:3, explain:"西晋是一个短命的王朝，统一全国后只维持了36年就灭亡了，不是长治久安的王朝。"},
  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["匈奴","鲜卑","羯","蒙古"], a:3, explain:"“五胡”是匈奴、鲜卑、羯、氐、羌，不包括蒙古。"},
  {tag:"第17课 西晋的短暂统一和北方各族的内迁", opts:["统治腐朽，内部混战","少数民族内迁","农民起义","外族入侵"], a:0, explain:"西晋统治腐朽，“八王之乱”耗尽了西晋的国力，这是西晋灭亡的根本原因。"},

  {tag:"第18课 东晋南朝政治和江南地区开发", q:"东晋的建立者是？", opts:["司马炎","司马睿","司马懿","司马昭"], a:1, explain:"317年，司马睿重建晋朝，以建康为都城，史称东晋。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", q:"东晋的都城是？", opts:["洛阳","长安","建康","北京"], a:2, explain:"东晋的都城是建康，也就是今天的南京。"},

  // 第19课 北魏政治和北方民族大交融
  {tag:"第18课 东晋南朝政治和江南地区开发", q:"东晋的建立者是？", opts:["司马炎","司马睿","司马懿","司马昭"], a:1, explain:"317年，司马睿重建晋朝，以建康为都城，史称东晋。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["316年","317年","383年","420年"], a:1, explain:"317年，司马睿重建晋朝，以建康为都城，史称东晋。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["洛阳","长安","建康","北京"], a:2, explain:"东晋的都城是建康，也就是今天的南京。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["王导和司马睿","王敦和司马昭","王安石和司马光","王莽和司马懿"], a:0, explain:"东晋初年，司马睿能当上皇帝，主要依赖于王导、王敦兄弟的支持，所以当时人说“王与马，共天下”。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["官渡之战","赤壁之战","淝水之战","巨鹿之战"], a:2, explain:"383年，东晋和前秦在淝水进行决战，东晋以少胜多，大败前秦。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["东晋和前秦","东晋和北魏","西晋和前秦","东晋和匈奴"], a:0, explain:"383年，东晋和前秦在淝水进行决战，东晋以少胜多，大败前秦。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["东晋大败前秦","前秦大败东晋","双方议和","两败俱伤"], a:0, explain:"383年，东晋和前秦在淝水进行决战，东晋以少胜多，大败前秦。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["解除了来自北方的威胁，为江南地区的开发提供了稳定的环境","使前秦统一了北方","使东晋统一了全国","使南北朝对峙局面形成"], a:0, explain:"淝水之战，东晋大败前秦，解除了来自北方的威胁，为江南地区的开发提供了稳定的环境。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["风声鹤唳","草木皆兵","投鞭断流","破釜沉舟"], a:3, explain:"破釜沉舟与巨鹿之战有关，与淝水之战无关。风声鹤唳、草木皆兵、投鞭断流都出自淝水之战。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["官渡之战","赤壁之战","淝水之战","巨鹿之战"], a:2, explain:"淝水之战中，前秦军队溃败，听到风声和鹤叫声，都以为是追兵，看到山上的草木，都以为是晋兵，这就是“风声鹤唳”“草木皆兵”的典故。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["苻坚","谢安","谢玄","司马睿"], a:0, explain:"前秦皇帝苻坚说，我有这么多军队，把马鞭投到长江里，都能截断江水，这就是“投鞭断流”的典故。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["宋、齐、梁、陈","齐、宋、梁、陈","宋、梁、齐、陈","陈、梁、齐、宋"], a:0, explain:"420年，刘裕自立为帝，国号宋，结束了东晋的统治，此后160多年间，南方先后经历了宋、齐、梁、陈四个朝代，都城都在建康，史称“南朝”。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["洛阳","长安","建康","北京"], a:2, explain:"南朝的宋、齐、梁、陈四个朝代，都城都在建康，也就是今天的南京。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["西汉时期","东汉时期","魏晋南北朝时期","隋唐时期"], a:2, explain:"魏晋南北朝时期，江南地区得到开发，经济迅速发展起来。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["北方人大量南迁，带来了劳动力和先进的生产技术","南方自然条件优越","南方社会比较安定","南方统治者重视农业生产"], a:0, explain:"魏晋南北朝时期，北方人大量南迁，给江南地区输送了大量的劳动力，也带来了中原先进的生产工具和生产技术，这是江南地区得到开发的最主要原因。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["开垦大量荒地，兴修很多水利工程","农业生产技术有了很大改进","实行精耕细作","全国经济重心已经转移到南方"], a:3, explain:"江南地区得到开发，但全国经济重心还在北方，经济重心南移是在南宋时期完成的。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["为经济重心逐渐南移奠定了基础","促进了江南地区的发展","加强了南北经济文化交流","以上都是"], a:3, explain:"江南地区得到开发，促进了江南地区的发展，加强了南北经济文化交流，为经济重心逐渐南移奠定了基础。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["北方人大量南迁，带来了劳动力和先进技术","江南地区自然条件优越","江南地区社会比较安定","江南地区开发后，全国经济重心已经转移到南方"], a:3, explain:"江南地区开发后，全国经济重心还在北方，经济重心南移是在南宋时期完成的。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["宋","齐","梁","陈"], a:0, explain:"宋是南朝四个朝代中疆域最大的朝代。"},
  {tag:"第18课 东晋南朝政治和江南地区开发", opts:["北京","南京","西安","洛阳"], a:1, explain:"东吴、东晋、宋、齐、梁、陈六个朝代都以建康为都城，建康就是今天的南京，所以南京被称为“六朝古都”。"},

  {tag:"第19课 北朝政治和北方民族大交融", q:"北魏孝文帝改革的主要目的是？", opts:["抵御匈奴","学习汉族先进文化，加强统治","统一全国","发展经济"], a:1, explain:"北魏孝文帝即位后，立志用文治移风易俗，他力排众议，494年迁都洛阳，把百余万包括鲜卑族在内的北方各族人民迁到中原，进一步推行汉化措施。"},
  {tag:"第19课 北朝政治和北方民族大交融", q:"北魏孝文帝把都城迁到了？", opts:["平城","洛阳","长安","建康"], a:1, explain:"494年，北魏孝文帝迁都洛阳。"},
  {tag:"第19课 北朝政治和北方民族大交融", q:"北魏孝文帝改革的突出作用是？", opts:["促进了民族交融","加强了中央集权","抵御了外族入侵","发展了经济"], a:0, explain:"北魏孝文帝改革，促进了民族交融，也增强了北魏的实力。"},

  // 第20课 魏晋南北朝的科技与文化
  {tag:"第19课 北朝政治和北方民族大交融", q:"北魏是由哪个少数民族建立的？", opts:["匈奴","鲜卑","羯","氐"], a:1, explain:"北魏是由鲜卑族拓跋部建立的，439年，北魏统一了北方。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["383年","439年","494年","589年"], a:1, explain:"439年，北魏统一了北方，结束了十六国以来的分裂割据局面。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["平城","洛阳","长安","建康"], a:1, explain:"494年，北魏孝文帝迁都洛阳。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["439年","494年","581年","618年"], a:1, explain:"494年，北魏孝文帝迁都洛阳，把百余万包括鲜卑族在内的北方各族人民迁到中原。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["说汉语","穿汉服","改汉姓","实行郡县制"], a:3, explain:"北魏孝文帝改革的内容包括：说汉语、穿汉服、改汉姓、与汉族通婚、采用汉族的官制、律令等，不包括实行郡县制。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["说汉语","穿汉服","改汉姓","与汉族通婚"], a:0, explain:"北魏孝文帝改革，规定官员在朝廷中必须使用汉语，禁用鲜卑语，这是“说汉语”。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["说汉语","穿汉服","改汉姓","与汉族通婚"], a:1, explain:"北魏孝文帝改革，规定以汉服代替鲜卑服，这是“穿汉服”。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["说汉语","穿汉服","改汉姓","与汉族通婚"], a:2, explain:"北魏孝文帝改革，规定改鲜卑姓为汉姓，如把拓跋姓改为元姓，这是“改汉姓”。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["说汉语","穿汉服","改汉姓","与汉族通婚"], a:3, explain:"北魏孝文帝改革，规定鼓励鲜卑贵族与汉族贵族联姻，这是“与汉族通婚”。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["元","陆","穆","贺"], a:0, explain:"北魏孝文帝改革，改鲜卑姓为汉姓，把拓跋姓改为元姓。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["促进了民族交融","加强了中央集权","抵御了外族入侵","发展了经济"], a:0, explain:"北魏孝文帝改革，促进了民族交融，也增强了北魏的实力。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["促进了民族交融，增强了北魏的实力","加强了中央集权","抵御了外族入侵","发展了经济"], a:0, explain:"北魏孝文帝改革，促进了民族交融，也增强了北魏的实力，为以后隋唐时期多民族国家的繁荣与发展奠定了基础。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["内迁各族人民在生产和生活上相互交流，相互影响","各族人民在语言、服饰、习俗等方面相互学习","民族之间的隔阂和偏见完全消失了","为中华民族的发展注入了新的活力"], a:2, explain:"南北朝时期，北方地区出现了民族大交融的趋势，但民族之间的隔阂和偏见并没有完全消失，只是逐渐减少了。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["为中华民族的发展注入了新的活力","进一步丰富了中华民族的物质文化和精神文化","为隋唐时期多民族国家的繁荣与发展奠定了基础","以上都是"], a:3, explain:"北方地区民族大交融，为中华民族的发展注入了新的活力，进一步丰富了中华民族的物质文化和精神文化，为隋唐时期多民族国家的繁荣与发展奠定了基础。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["顺应了历史发展的潮流","得到了汉族地主的支持","孝文帝的决心","鲜卑族文化落后"], a:0, explain:"北魏孝文帝改革，顺应了北方民族大交融的历史发展潮流，这是改革成功的根本原因。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["封建化改革","奴隶制改革","社会主义改革","资本主义改革"], a:0, explain:"北魏孝文帝改革，是鲜卑族学习汉族先进文化，从奴隶社会向封建社会过渡的封建化改革。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["迁都洛阳","推行汉化措施","促进了民族交融","使北魏分裂为东魏和西魏"], a:3, explain:"北魏孝文帝改革，促进了民族交融，增强了北魏的实力，北魏分裂为东魏和西魏是在孝文帝改革之后，不是改革的结果。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["北魏统一北方","北魏孝文帝迁都洛阳","北魏分裂为东魏和西魏","北周灭掉北齐"], a:0, explain:"439年，北魏统一北方，北朝开始。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["东魏、西魏、北齐、北周","北魏、东魏、西魏、北齐","东魏、西魏、北齐、隋","北魏、北齐、北周、隋"], a:0, explain:"北魏分裂为东魏和西魏，后来东魏被北齐取代，西魏被北周取代，这四个王朝统称为北朝。"},
  {tag:"第19课 北朝政治和北方民族大交融", opts:["民族迁徙","联合斗争","友好往来","战争征服"], a:3, explain:"南北朝时期，北方民族交融的方式包括民族迁徙、联合斗争、友好往来、改革等，战争征服不是民族交融的主要方式。"},

  {tag:"第20课 三国两晋南北朝时期的科技与文化", q:"世界上第一个把圆周率精确到小数点以后第七位的科学家是？", opts:["祖冲之","贾思勰","郦道元","王羲之"], a:0, explain:"祖冲之把圆周率精确到小数点以后的第七位数字，即3.1415926和3.1415927之间，这项成果领先世界近千年。"},
  {tag:"第20课 三国两晋南北朝时期的科技与文化", q:"我国现存最早的一部完整的农书是？", opts:["《齐民要术》","《农政全书》","《天工开物》","《本草纲目》"], a:0, explain:"《齐民要术》是我国现存最早的一部完整的农书，对后世农学的发展有深远的影响，在世界农学史上占有重要地位。"},
  {tag:"第20课 三国两晋南北朝时期的科技与文化", q:"《齐民要术》的作者是？", opts:["祖冲之","贾思勰","郦道元","王羲之"], a:1, explain:"《齐民要术》的作者是北朝的贾思勰。"},
  {tag:"第20课 三国两晋南北朝时期的科技与文化", q:"被后世称为“书圣”的是？", opts:["王羲之","王献之","颜真卿","柳公权"], a:0, explain:"王羲之的书法为古今之冠，笔势“飘若浮云，矫若惊龙”，他的代表作是《兰亭集序》，他被后人誉为“书圣”。"},

// 状态
const QUESTION_TIME = 15;
const TOTAL_Q = 10;
let currentLesson = "";
let currentQuestions = [];
let qIndex = 0;
let score = 0;
let combo = 0;
let lives = 3;
let correctCount = 0;
let timerInterval = null;
let timeLeft = QUESTION_TIME;

// 初始化：提取所有课
function getLessons(){
  const lessonSet = {};
  POOL.forEach(q=>{
    if(!lessonSet[q.tag]) lessonSet[q.tag] = 0;
    lessonSet[q.tag]++;
  });
  return Object.entries(lessonSet).map(([name, count])=>({name, count}));
}

// 渲染课程列表
function renderLessons(){
  const lessons = getLessons();
  const list = document.getElementById("lessonList");
  list.innerHTML = "";
  lessons.forEach((lesson, idx)=>{
    const div = document.createElement("div");
    div.className = "lesson-card";
    div.innerHTML = `
      <div class="lesson-num">${idx+1}</div>
      <div class="lesson-info">
        <div class="lesson-title">${lesson.name}</div>
        <div class="lesson-meta">共${lesson.count}题 · 每次随机${Math.min(TOTAL_Q, lesson.count)}题</div>
      </div>
      <div class="lesson-arrow">→</div>
    `;
    div.onclick = ()=>startQuiz(lesson.name);
    list.appendChild(div);
  });
}

// 开始答题
function startQuiz(lessonName){
  currentLesson = lessonName;
  const lessonQuestions = POOL.filter(q=>q.tag === lessonName);
  currentQuestions = shuffle(lessonQuestions).slice(0, Math.min(TOTAL_Q, lessonQuestions.length));
  qIndex = 0;
  score = 0;
  combo = 0;
  lives = 3;
  correctCount = 0;
  document.getElementById("qTotal").innerText = currentQuestions.length;
  document.getElementById("currentLesson").innerText = lessonName;
  showQuestion();
  switchPage("pageQuiz");
}

function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// 显示题目
function showQuestion(){
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimer();
  
  const q = currentQuestions[qIndex];
  document.getElementById("qNum").innerText = qIndex+1;
  document.getElementById("lives").innerText = lives;
  document.getElementById("combo").innerText = combo;
  document.getElementById("score").innerText = score;
  document.getElementById("questionText").innerText = (qIndex+1) + ". " + q.q;
  
  const optWrap = document.getElementById("options");
  optWrap.innerHTML = "";
  q.opts.forEach((op, idx)=>{
    const div = document.createElement("div");
    div.className = "option";
    div.innerText = String.fromCharCode(65+idx) + ". " + op;
    div.onclick = ()=>chooseAnswer(div, idx, q.a, q.explain);
    optWrap.appendChild(div);
  });
  
  document.getElementById("explainPanel").classList.remove("show");
  startTimer();
}

function startTimer(){
  stopTimer();
  timeLeft = QUESTION_TIME;
  updateTimer();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimer();
    if(timeLeft <= 0){
      stopTimer();
      timeUp();
    }
  }, 1000);
}

function stopTimer(){
  if(timerInterval){
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

function updateTimer(){
  const bar = document.getElementById("timerFill");
  const percent = (timeLeft / QUESTION_TIME) * 100;
  bar.style.width = percent + "%";
  if(timeLeft <= 5){
    bar.classList.add("warning");
  }else{
    bar.classList.remove("warning");
  }
}

function timeUp(){
  lives--;
  combo = 0;
  const q = currentQuestions[qIndex];
  const options = document.querySelectorAll(".option");
  options.forEach(o=>{
    o.classList.add("disabled");
    const idx = String.fromCharCode(65) + ". ";
    if(o.innerText.startsWith(String.fromCharCode(65+q.a) + ". ")){
      o.classList.add("right");
    }
  });
  audioWrong.currentTime = 0;
  audioWrong.play();
  speakText("时间到，答错了");
  showExplain(q.explain);
}

// 选择答案
function chooseAnswer(el, idx, correctIdx, explain){
  stopTimer();
  const options = document.querySelectorAll(".option");
  options.forEach(o=>o.classList.add("disabled"));
  
  if(idx === correctIdx){
    el.classList.add("right");
    combo++;
    score += 10;
    correctCount++;
    audioCorrect.currentTime = 0;
    audioCorrect.play();
    speakText("答对了");
  }else{
    el.classList.add("wrong");
    lives--;
    combo = 0;
    options.forEach(o=>{
      const oIdx = o.innerText.charAt(0).charCodeAt(0) - 65;
      if(oIdx === correctIdx) o.classList.add("right");
    });
    audioWrong.currentTime = 0;
    audioWrong.play();
    speakText("答错了");
  }
  
  showExplain(explain);
}

function showExplain(text){
  document.getElementById("explainText").innerText = text;
  document.getElementById("explainPanel").classList.add("show");
}

function nextQuestion(){
  qIndex++;
  if(lives <= 0){
    showResult();
    return;
  }
  if(qIndex >= currentQuestions.length){
    showResult();
    return;
  }
  showQuestion();
}

function showResult(){
  stopTimer();
  let msg = "";
  if(lives > 0 && correctCount === currentQuestions.length){
    msg = "满分通关！历史小达人就是你！🎉";
  }else if(correctCount >= currentQuestions.length * 0.8){
    msg = "很不错！继续加油！👍";
  }else if(correctCount >= currentQuestions.length * 0.6){
    msg = "还可以，再复习一下错题！💪";
  }else{
    msg = "别灰心，回去再看看课本！📖";
  }
  document.getElementById("finalScore").innerText = score;
  document.getElementById("resultMsg").innerHTML = `答对了 ${correctCount}/${currentQuestions.length} 题<br>${msg}`;
  switchPage("pageResult");
  speakText("挑战完成，得分" + score);
}

function retryQuiz(){
  startQuiz(currentLesson);
}

function backToLessons(){
  renderLessons();
  switchPage("pageHome");
}

function switchPage(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0,0);
}

// 防复制
document.addEventListener('contextmenu', e=>e.preventDefault());
document.addEventListener('selectstart', e=>e.preventDefault());
document.addEventListener('copy', e=>e.preventDefault());

// 初始化
renderLessons();
</script>
